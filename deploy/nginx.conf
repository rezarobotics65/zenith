# Reverse proxy + static/media serving for the Zenith Career Tracker.
# Install as /etc/nginx/conf.d/zenith.conf on the EC2 instance.
#
# IP-only for now (no domain/HTTPS yet) — server_name is left as "_" so it
# matches any Host header. Once a domain is pointed at this instance, change
# server_name to the domain and run Certbot (see DEPLOYMENT.md).

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;  # CV/resume PDF uploads

    location /static/ {
        alias /home/ec2-user/zenith/staticfiles/;
    }

    location /media/ {
        alias /home/ec2-user/zenith/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
