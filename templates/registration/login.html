{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Career Tracker</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="login-body">
<main class="login-card" id="main-content">
  <h1>Career Tracker</h1>
  <p class="login-subtitle">Staff sign-in required.</p>

  {% if form.errors %}
    <p class="form-error" role="alert">Your username and password didn't match. Please try again.</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}" novalidate>
    {% csrf_token %}
    <div class="form-row">
      <label for="id_username">Username</label>
      {{ form.username }}
    </div>
    <div class="form-row">
      <label for="id_password">Password</label>
      {{ form.password }}
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button button--primary">Sign in</button>
  </form>
</main>
</body>
</html>
